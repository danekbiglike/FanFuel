<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FanFuel</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var requested = params.get("theme") || "";
          var preference = requested;
          if (requested === "transparent") {
            document.documentElement.dataset.widgetTheme = "transparent";
            preference = "dark";
          } else {
            document.documentElement.dataset.widgetTheme = "panel";
          }
          if (!/^(system|light|dark)$/.test(preference || "")) {
            preference = window.localStorage.getItem("fanfuel_theme_preference") || "system";
          }
          if (!/^(system|light|dark)$/.test(preference || "")) preference = "system";
          var resolved =
            preference === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.themePreference = "system";
          document.documentElement.dataset.widgetTheme = "transparent";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
