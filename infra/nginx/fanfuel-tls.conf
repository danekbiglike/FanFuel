# Применяется на FanFuel VM после успешного certbot certonly --webroot.
# Edge передаёт TLS без расшифровки; сертификат остаётся на VM приложения.
map $http_upgrade $fanfuel_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=fanfuel_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=fanfuel_auth:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name fanfuel.ru www.fanfuel.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://fanfuel.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fanfuel.ru www.fanfuel.ru;
    ssl_certificate /etc/letsencrypt/live/fanfuel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fanfuel.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FanFuelTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 10m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/v1/admin/ { return 404; }
    location ^~ /api/v1/mock/ { return 404; }
    location ^~ /api/v1/auth/ {
        limit_req zone=fanfuel_auth burst=10 nodelay;
        include /etc/nginx/snippets/fanfuel-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/ {
        limit_req zone=fanfuel_api burst=30 nodelay;
        include /etc/nginx/snippets/fanfuel-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }
    location /ws/ {
        limit_req zone=fanfuel_api burst=10 nodelay;
        access_log off;
        include /etc/nginx/snippets/fanfuel-proxy.conf;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:8081;
    }
    location = /widget { return 301 /widget/; }
    location /widget/ {
        access_log off;
        include /etc/nginx/snippets/fanfuel-proxy.conf;
        proxy_pass http://127.0.0.1:5173/;
    }
    location / {
        include /etc/nginx/snippets/fanfuel-proxy.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
