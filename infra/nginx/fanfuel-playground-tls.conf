# Статическая площадка внутри существующего nginx FanFuel VM.
server {
    listen 80;
    server_name playground.fanfuel.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://playground.fanfuel.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name playground.fanfuel.ru;
    ssl_certificate /etc/letsencrypt/live/playground.fanfuel.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playground.fanfuel.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FanFuelPlaygroundTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    root /var/www/fanfuel-playground/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
