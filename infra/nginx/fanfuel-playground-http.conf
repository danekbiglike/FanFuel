# Временный HTTP host для выпуска сертификата playground.fanfuel.ru.
server {
    listen 80;
    server_name playground.fanfuel.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://playground.fanfuel.ru$request_uri;
    }
}
